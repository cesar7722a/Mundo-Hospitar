<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Conheça os doutores do Mundo Hospitalar e consulte o perfil, a experiência e o horário de cada especialista."
    />
    <meta name="theme-color" content="#1d2a4d" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/dotores.css" />
    <link rel="stylesheet" href="assets/fonts/css/all.css" />
    <title>Doutores | Mundo Hospitalar</title>
  </head>
  <body>
    <!-- Header partilhado (js/layout.js) -->
    <div id="site-header"></div>
    <script src="js/layout.js"></script>

    <main id="conteudo" tabindex="-1">
      <!-- Banner -->
      <section class="banner">
        <div class="banner-2" aria-hidden="true"></div>
        <div class="container--banner-2">
          <h1>Nossos Doutores</h1>
          <p>Faça a sua consulta e torne a sua vida mais feliz</p>
        </div>
      </section>

      <!-- Lista de doutores (gerada por js/doutores-lista.js) -->
      <section class="nossos-doctores" aria-labelledby="titulo-doutores">
        <h2 id="titulo-doutores">Nossos Doutores</h2>
        <p id="desc-nossos-doctores">
          Dignissimos asperiores vitae velit veniam totam fuga molestias
          accusamus alias autem provident. Odit ab aliquam dolor eius.
        </p>
        <ul class="card-doctor" id="lista-doutores"></ul>
        <noscript>
          <p class="aviso-noscript">
            É necessário ativar o JavaScript para ver a lista de doutores.
          </p>
        </noscript>
      </section>

      <!-- Modal do perfil do doutor (elemento nativo <dialog>) -->
      <dialog
        class="modalDoutor"
        id="modal-doutor"
        aria-labelledby="doutor-nome"
      >
        <div class="doutor-conteudo">
          <button
            type="button"
            class="doutor-fechar"
            aria-label="Fechar perfil do doutor"
          >
            <i class="fas fa-xmark" aria-hidden="true"></i>
          </button>
          <img class="doutor-foto" id="doutor-foto" alt="" />
          <div class="doutor-info">
            <h2 id="doutor-nome"></h2>
            <p class="doutor-especialidade" id="doutor-especialidade"></p>
            <p class="doutor-sobre" id="doutor-sobre"></p>
            <dl class="doutor-detalhes" id="doutor-detalhes"></dl>
            <div class="doutor-acoes">
              <button type="button" class="btn-marcar" id="doutor-marcar">
                Marcar consulta
              </button>
              <a class="btn-ligar" href="tel:+244926614139"
                ><i class="fas fa-phone" aria-hidden="true"></i>Ligar</a
              >
            </div>
          </div>
        </div>
      </dialog>
    </main>

    <div id="site-footer"></div>

    <!-- 1. Dados fixos dos doutores -->
    <script src="js/doutores-data.js"></script>
    <!-- 2. Lista de doutores + modal de perfil -->
    <script src="js/doutores-lista.js"></script>
  </body>
</html>
